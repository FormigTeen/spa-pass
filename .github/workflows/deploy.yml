name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

# Pushes the built site to the gh-pages branch, which is what Pages serves.
permissions:
  contents: write

# A newer push supersedes an in-flight deploy, but never cancels one midway.
concurrency:
  group: gh-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - run: yarn install --frozen-lockfile

      # Type errors must fail the deploy, so run the real build script.
      - run: yarn build

      # public/CNAME lands in dist/, keeping the custom domain across deploys.
      - name: Verify custom domain survived the build
        run: test -f dist/CNAME && cat dist/CNAME

      - name: Publish to gh-pages
        working-directory: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # SPA fallback: Pages serves 404.html for unknown paths.
          cp index.html 404.html
          git init -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "deploy ${GITHUB_SHA} from ${GITHUB_REF_NAME}"
          git push --force \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            gh-pages
